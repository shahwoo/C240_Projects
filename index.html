<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Invaders Sprite Demo</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #05050f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .wrapper {
      text-align: center;
      position: relative;
      max-width: 840px;
      width: 100%;
    }

    canvas {
      display: block;
      width: 800px;
      height: 600px;
      background: #000;
      border: 4px solid #2d6cff;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease-in-out;
    }

    .overlay.visible {
      pointer-events: auto;
      opacity: 1;
    }

    .overlay-card {
      width: min(280px, 90%);
      padding: 24px 22px;
      border-radius: 16px;
      background: rgba(10, 15, 40, 0.96);
      border: 1px solid rgba(115, 170, 255, 0.35);
      text-align: center;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
    }

    .overlay h2 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      letter-spacing: 0.2em;
    }

    .overlay p {
      margin: 0 0 18px;
      color: #a4c4ff;
      font-size: 0.95rem;
    }

    .overlay button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: #2d6cff;
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .overlay button:hover {
      background: #5390ff;
      transform: translateY(-1px);
    }

    .overlay button:active {
      transform: translateY(0);
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: 1.6rem;
      letter-spacing: 0.04em;
    }

    p.instructions {
      margin: 0.25rem 0 0;
      color: #a2c4ff;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Space Invaders Sprite Demo</h1>
    <canvas id="gameCanvas" width="320" height="240"></canvas>
    <div class="overlay" id="gameOverlay">
      <div class="overlay-card">
        <h2>GAME OVER</h2>
        <p id="finalScoreText">Final Score: 0</p>
        <button id="restartButton">Play Again</button>
      </div>
    </div>
    <p class="instructions">Use arrow keys to move, Space to shoot. Destroy invaders before they reach your row.</p>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const overlay = document.getElementById('gameOverlay');
    const restartButton = document.getElementById('restartButton');
    const finalScoreText = document.getElementById('finalScoreText');

    const scale = 2; // pixels per game unit
    const width = canvas.width; // pixels
    const height = canvas.height; // pixels
    const U = { w: Math.floor(width / scale), h: Math.floor(height / scale) }; // units
    const hitboxScale = 0.8;

    const sprites = {
      invader1: [
        [
          '0011100',
          '0111110',
          '1111111',
          '1011011',
          '0111110',
          '0010010',
        ],
        [
          '0011100',
          '0111110',
          '1111111',
          '1101111',
          '0111110',
          '0010010',
        ],
      ],
      invader2: [
        [
          '0001000',
          '0011100',
          '0111110',
          '1111111',
          '0111110',
          '0100010',
        ],
        [
          '0001000',
          '0011100',
          '0111110',
          '1111111',
          '0111110',
          '0010010',
        ],
      ],
      invader3: [
        [
          '0010010',
          '0111110',
          '1111111',
          '1011111',
          '0100010',
          '0010010',
        ],
        [
          '0010010',
          '0111110',
          '1111111',
          '1101111',
          '0110010',
          '0010010',
        ],
      ],
      player: [
        [
          '000100000',
          '001110000',
          '011111100',
          '111011110',
          '111111111',
          '011011110',
          '001110000',
        ],
      ],
    };

    const spritePalette = {
      bullet: '#fff',
      flash: '#fff',
    };

    // Per-sprite colors inspired by common Space Invaders palettes (row-based)
    const spriteColors = {
      invader1: { fill: '#9ef542', shadow: '#3b6f12' }, // greenish
      invader2: { fill: '#4fe7e0', shadow: '#0b6f6a' }, // cyan
      invader3: { fill: '#ff7b6b', shadow: '#6f2b24' }, // reddish
      player:   { fill: '#ffffff', shadow: '#444444', detail: '#cfc' }, // white player cannon
    };

    const invaderRows = [
      { type: 'invader1', row: 0, count: 6, value: 30 }, // top row
      { type: 'invader2', row: 1, count: 6, value: 20 },
      { type: 'invader3', row: 2, count: 6, value: 10 },
    ];

    const pixelFont = {
      ' ': ['000', '000', '000', '000', '000'],
      S: ['011', '100', '010', '001', '110'],
      C: ['011', '100', '100', '100', '011'],
      O: ['111', '101', '101', '101', '111'],
      R: ['110', '101', '110', '101', '101'],
      E: ['111', '100', '110', '100', '111'],
      0: ['111', '101', '101', '101', '111'],
      1: ['010', '110', '010', '010', '111'],
      2: ['111', '001', '111', '100', '111'],
      3: ['111', '001', '111', '001', '111'],
      4: ['101', '101', '111', '001', '001'],
      5: ['111', '100', '111', '001', '111'],
      6: ['111', '100', '111', '101', '111'],
      7: ['111', '001', '010', '010', '010'],
      8: ['111', '101', '111', '101', '111'],
      9: ['111', '101', '111', '001', '111'],
    };

    const lifeSprite = [
      '00100',
      '01110',
      '11111',
      '10101',
    ];

    function drawPixelText(text, x, y, color = '#7bf') {
      let cursor = x;
      for (const char of text.toUpperCase()) {
        const bitmap = pixelFont[char] || pixelFont[' '];
        for (let row = 0; row < bitmap.length; row += 1) {
          const line = bitmap[row];
          for (let col = 0; col < line.length; col += 1) {
            if (line[col] === '1') {
              ctx.fillStyle = color;
              ctx.fillRect((cursor + col) * scale, (y + row) * scale, scale, scale);
            }
          }
        }
        cursor += bitmap[0].length + 1;
      }
    }

    function drawLifeSprite(x, y) {
      for (let row = 0; row < lifeSprite.length; row += 1) {
        const line = lifeSprite[row];
        for (let col = 0; col < line.length; col += 1) {
          if (line[col] === '1') {
            ctx.fillStyle = row === 0 ? '#5f5' : '#0f0';
            ctx.fillRect((x + col) * scale, (y + row) * scale, scale, scale);
          }
        }
      }
    }

    function drawGroundLine() {
      const groundY = player.y - 2;
      ctx.fillStyle = '#0d0';
      ctx.fillRect(0, groundY * scale, width, scale);
    }

    const player = {
      x: Math.floor((U.w - 9) / 2),
      y: U.h - 12,
      width: 9,
      height: 7,
      speed: 1.5,
      movingLeft: false,
      movingRight: false,
      flash: 0,
    };

    let score = 0;
    let lives = 3;
    let gameOver = false;
    let animationTick = 0;
    let playerFireCooldown = 0;
    let invaderFireCounter = 60;

    const invaderFormation = {
      x: 0, // units
      y: 6, // starting y units
      direction: 1,
      speed: 0.25, // units per tick
      stepDown: 4, // units to descend when hitting edge
    };

    let invaders = [];
    let playerBullets = [];
    let invaderBullets = [];
    let bunkers = [];

    const bunkerShape = [
      '0011100',
      '0111110',
      '1111111',
      '1110111',
      '1111111',
      '0111110',
    ];

    const bunkerPalette = {
      fill: '#5fd',
      shadow: '#043',
      damage: '#072',
    };

    const bunkerImpactRadius = 1;

    function makeDamageMap(shape) {
      return shape.map((line) => line.split('').map((pixel) => pixel === '1'));
    }

    function getSpriteSize(bitmap) {
      return { width: bitmap[0].length, height: bitmap.length };
    }

    function hitboxForSprite(x, y, bitmap) {
      const { width: w, height: h } = getSpriteSize(bitmap);
      const hitW = w * hitboxScale;
      const hitH = h * hitboxScale;
      return {
        x: x + (w - hitW) / 2,
        y: y + (h - hitH) / 2,
        width: hitW,
        height: hitH,
      };
    }

    function rectanglesOverlap(a, b) {
      return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
    }

    function createInvaders() {
      invaders = [];
      invaderFormation.x = 2;
      invaderFormation.y = 6;
      invaderFormation.direction = 1;

      invaderRows.forEach((row) => {
        const frame = sprites[row.type][0];
        const spriteW = frame[0].length;
        const spriteH = frame.length;
        const spacing = spriteW + 4;
        const totalWidth = row.count * spacing - 4;
        const startX = Math.floor((U.w - totalWidth) / 2);
        const baseY = invaderFormation.y + row.row * (spriteH + 4);

        for (let i = 0; i < row.count; i += 1) {
          invaders.push({
            type: row.type,
            value: row.value,
            baseX: startX + i * spacing,
            baseY,
            alive: true,
          });
        }
      });
    }

    function createBunkers() {
      bunkers = [];
      const bunkerWidth = bunkerShape[0].length;
      const bunkerHeight = bunkerShape.length;
      const bunkerCount = 4;
      const spacing = Math.floor((U.w - bunkerCount * bunkerWidth) / (bunkerCount + 1));
      const y = player.y - bunkerHeight - 6;

      for (let i = 0; i < bunkerCount; i += 1) {
        bunkers.push({
          x: spacing + i * (bunkerWidth + spacing),
          y,
          width: bunkerWidth,
          height: bunkerHeight,
          damageMap: makeDamageMap(bunkerShape),
        });
      }
    }

    function drawBunkers() {
      bunkers.forEach((bunker) => {
        for (let row = 0; row < bunker.height; row += 1) {
          for (let col = 0; col < bunker.width; col += 1) {
            if (!bunker.damageMap[row][col]) continue;

            ctx.fillStyle = bunkerPalette.fill;
            ctx.fillRect((bunker.x + col) * scale, (bunker.y + row) * scale, scale, scale);
            ctx.fillStyle = bunkerPalette.shadow;
            ctx.fillRect((bunker.x + col) * scale, (bunker.y + row) * scale + scale, scale, 1);
          }
        }
      });
    }

    function getBunkerBounds(bunker) {
      return {
        x: bunker.x,
        y: bunker.y,
        width: bunker.width,
        height: bunker.height,
      };
    }

    function damageBunker(bunker, impactX, impactY, radius) {
      const localX = Math.floor(impactX - bunker.x);
      const localY = Math.floor(impactY - bunker.y);

      for (let dy = -radius; dy <= radius; dy += 1) {
        for (let dx = -radius; dx <= radius; dx += 1) {
          if (dx * dx + dy * dy > radius * radius) continue;

          const x = localX + dx;
          const y = localY + dy;
          if (x < 0 || x >= bunker.width || y < 0 || y >= bunker.height) continue;
          bunker.damageMap[y][x] = false;
        }
      }
    }

    function bulletHitsBunker(bullet, bunker) {
      const startX = Math.max(0, Math.floor(bullet.x - bunker.x));
      const endX = Math.min(bunker.width - 1, Math.floor(bullet.x + bullet.width - bunker.x));
      const startY = Math.max(0, Math.floor(bullet.y - bunker.y));
      const endY = Math.min(bunker.height - 1, Math.floor(bullet.y + bullet.height - bunker.y));

      for (let row = startY; row <= endY; row += 1) {
        for (let col = startX; col <= endX; col += 1) {
          if (bunker.damageMap[row][col]) {
            return true;
          }
        }
      }
      return false;
    }

    function handleBulletBunkerCollisions() {
      playerBullets.forEach((bullet) => {
        if (bullet.hit) return;
        for (const bunker of bunkers) {
          if (!rectanglesOverlap(bullet, getBunkerBounds(bunker))) continue;
          if (bulletHitsBunker(bullet, bunker)) {
            bullet.hit = true;
            damageBunker(bunker, bullet.x + bullet.width / 2, bullet.y + bullet.height / 2, bunkerImpactRadius);
            break;
          }
        }
      });

      invaderBullets.forEach((bullet) => {
        if (bullet.hit) return;
        for (const bunker of bunkers) {
          if (!rectanglesOverlap(bullet, getBunkerBounds(bunker))) continue;
          if (bulletHitsBunker(bullet, bunker)) {
            bullet.hit = true;
            damageBunker(bunker, bullet.x + bullet.width / 2, bullet.y + bullet.height / 2, bunkerImpactRadius);
            break;
          }
        }
      });
    }

    function setGameOver() {
      if (gameOver) return;
      gameOver = true;
      finalScoreText.textContent = `Final Score: ${score}`;
      overlay.classList.add('visible');
    }

    function resetGame() {
      score = 0;
      lives = 3;
      gameOver = false;
      animationTick = 0;
      playerFireCooldown = 0;
      invaderFireCounter = 60;
      player.x = Math.floor((width - player.width) / 2);
      player.flash = 0;
      playerBullets = [];
      invaderBullets = [];
      overlay.classList.remove('visible');
      createInvaders();
      createBunkers();
    }

    function drawSprite(bitmap, x, y, color = (spritePalette.fill || '#7bf')) {
      ctx.fillStyle = color;
      for (let row = 0; row < bitmap.length; row += 1) {
        const line = bitmap[row];
        for (let col = 0; col < line.length; col += 1) {
          if (line[col] === '1') {
            ctx.fillRect((x + col) * scale, (y + row) * scale, scale, scale);
          }
        }
      }
    }

    function drawShadow(bitmap, x, y, type) {
      const color = (type && spriteColors[type] && spriteColors[type].shadow) || '#036';
      ctx.fillStyle = color;
      for (let row = 0; row < bitmap.length; row += 1) {
        const line = bitmap[row];
        for (let col = 0; col < line.length; col += 1) {
          if (line[col] === '1') {
            ctx.fillRect((x + col) * scale, (y + row) * scale + scale, scale, 1);
          }
        }
      }
    }

    function clearScreen() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, width, height);
    }

    function drawInvaders() {
      invaders.forEach((inv) => {
        if (!inv.alive) return;
        const frame = sprites[inv.type][Math.floor(animationTick / 30) % sprites[inv.type].length];
        const x = inv.baseX + invaderFormation.x;
        const y = inv.baseY + invaderFormation.y;
        drawShadow(frame, x, y, inv.type);
        const color = (spriteColors[inv.type] && spriteColors[inv.type].fill) || spritePalette.fill;
        drawSprite(frame, x, y, color);
      });
    }

    function drawPlayer() {
      const bitmap = sprites.player[0];
      const flashActive = player.flash > 0 && Math.floor(player.flash / 4) % 2 === 0;
      const baseColor = (spriteColors.player && spriteColors.player.fill) || '#fff';
      const playerColor = flashActive ? spritePalette.flash : baseColor;
      drawShadow(bitmap, player.x, player.y, 'player');
      drawSprite(bitmap, player.x, player.y, playerColor);
      ctx.fillStyle = '#f44';
      ctx.fillRect((player.x + 4) * scale, (player.y + 3) * scale, scale, scale);
      ctx.fillStyle = '#48f';
      ctx.fillRect((player.x + 2) * scale, (player.y + 4) * scale, scale, scale);
      ctx.fillRect((player.x + 6) * scale, (player.y + 4) * scale, scale, scale);
    }

    function drawBullets() {
      ctx.fillStyle = spritePalette.bullet;
      playerBullets.forEach((bullet) => {
        ctx.fillRect(bullet.x * scale, bullet.y * scale, bullet.width * scale, bullet.height * scale);
      });

      ctx.fillStyle = '#f44';
      invaderBullets.forEach((bullet) => {
        ctx.fillRect(bullet.x * scale, bullet.y * scale, bullet.width * scale, bullet.height * scale);
      });
    }

    function drawHUD() {
      drawPixelText('SCORE', 1, 1, '#7bf');
      drawPixelText(score.toString().padStart(5, '0'), 1, 8, '#7bf');

      const lifeY = height - 10;
      for (let i = 0; i < lives; i += 1) {
        drawLifeSprite(1 + i * 7, lifeY);
      }
    }

    function updatePlayer() {
      if (gameOver) return;
      if (player.movingLeft) player.x -= player.speed;
      if (player.movingRight) player.x += player.speed;
      player.x = Math.max(0, Math.min(player.x, width - player.width));
      if (player.flash > 0) player.flash -= 1;
      if (playerFireCooldown > 0) playerFireCooldown -= 1;
    }

    function updateInvaders() {
      if (gameOver) return;
      const alive = invaders.filter((inv) => inv.alive);
      if (alive.length === 0) return;

      const spriteWidth = sprites.invader1[0][0].length;
      const leftmost = Math.min(...alive.map((inv) => inv.baseX + invaderFormation.x));
      const rightmost = Math.max(...alive.map((inv) => inv.baseX + invaderFormation.x + spriteWidth));
      const isAtEdge = invaderFormation.direction > 0 ? rightmost >= U.w : leftmost <= 0;

      const bunkerY = bunkers.length > 0 ? bunkers[0].y : player.y - 6;
      const invaderBottom = Math.max(...alive.map((inv) => inv.baseY + invaderFormation.y + sprites[inv.type][0].length));
      const reachedBarricades = invaderBottom >= bunkerY;

      if (isAtEdge) {
        invaderFormation.direction *= -1;
        if (!reachedBarricades) {
          invaderFormation.y += invaderFormation.stepDown;
        }
      } else {
        invaderFormation.x += invaderFormation.direction * invaderFormation.speed;
      }
    }

    function updateBullets() {
      if (gameOver) return;

      playerBullets.forEach((bullet) => {
        bullet.y -= bullet.speed;
      });
      invaderBullets.forEach((bullet) => {
        bullet.y += bullet.speed;
      });

      handleBulletBunkerCollisions();

      playerBullets = playerBullets.filter((bullet) => bullet.y + bullet.height >= 0 && !bullet.hit);
      invaderBullets = invaderBullets.filter((bullet) => bullet.y <= U.h && !bullet.hit);

      const playerHitbox = hitboxForSprite(player.x, player.y, sprites.player[0]);

      invaderBullets.forEach((bullet) => {
        if (rectanglesOverlap(playerHitbox, bullet)) {
          bullet.hit = true;
          lives -= 1;
          player.flash = 24;
          if (lives <= 0) {
            setGameOver();
          }
        }
      });

      playerBullets.forEach((bullet) => {
        invaders.forEach((inv) => {
          if (!inv.alive || bullet.hit) return;
          const frame = sprites[inv.type][Math.floor(animationTick / 30) % sprites[inv.type].length];
          const invaderHitbox = hitboxForSprite(
            inv.baseX + invaderFormation.x,
            inv.baseY + invaderFormation.y,
            frame,
          );
          if (rectanglesOverlap(bullet, invaderHitbox)) {
            inv.alive = false;
            bullet.hit = true;
            score += inv.value;
          }
        });
      });

      if (invaders.every((inv) => !inv.alive) && !gameOver) {
        setGameOver();
      }
    }

    function checkInvaderAdvance() {
      if (gameOver) return;
      const reached = invaders.some((inv) => {
        if (!inv.alive) return false;
        const frame = sprites[inv.type][0];
        const y = inv.baseY + invaderFormation.y;
        return y + frame.length >= player.y;
      });
      if (reached) {
        setGameOver();
      }
    }

    function hasInvaderReachedBarrier() {
      if (gameOver) return false;
      if (bunkers.length === 0) return false;

      return invaders.some((inv) => {
        if (!inv.alive) return false;
        const frame = sprites[inv.type][0];
        const invaderX = inv.baseX + invaderFormation.x;
        const invaderY = inv.baseY + invaderFormation.y;
        const invaderBounds = {
          x: invaderX,
          y: invaderY,
          width: frame[0].length,
          height: frame.length,
        };

        return bunkers.some((bunker) => rectanglesOverlap(invaderBounds, getBunkerBounds(bunker)));
      });
    }

    function spawnInvaderBullet() {
      if (gameOver) return;
      if (invaderFireCounter > 0) {
        invaderFireCounter -= 1;
        return;
      }

      const shooters = invaders.filter((inv) => inv.alive);
      if (shooters.length === 0) return;

      const shooter = shooters[Math.floor(Math.random() * shooters.length)];
      const frame = sprites[shooter.type][Math.floor(animationTick / 30) % sprites[shooter.type].length];
      invaderBullets.push({
        x: shooter.baseX + invaderFormation.x + Math.floor(frame[0].length / 2) - 1,
        y: shooter.baseY + invaderFormation.y + frame.length,
        width: 2,
        height: 4,
        speed: 1.5,
      });
      invaderFireCounter = 60;
    }

    function firePlayerBullet() {
      if (gameOver || playerFireCooldown > 0) return;
      playerBullets.push({
        x: player.x + Math.floor(player.width / 2) - 1,
        y: player.y - 4,
        width: 2,
        height: 4,
        speed: 3,
      });
      playerFireCooldown = 18;
    }

    function render() {
      clearScreen();
      drawGroundLine();
      drawInvaders();
      drawBunkers();
      drawBullets();
      drawPlayer();
      drawHUD();
    }

    function loop() {
      updatePlayer();
      updateInvaders();
      updateBullets();
      spawnInvaderBullet();
      checkInvaderAdvance();
      if (hasInvaderReachedBarrier()) {
        setGameOver();
      }
      render();
      animationTick += 1;
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (event) => {
      if (event.code === 'ArrowLeft') player.movingLeft = true;
      if (event.code === 'ArrowRight') player.movingRight = true;
      if (event.code === 'Space' || event.code === 'ArrowUp') {
        event.preventDefault();
        firePlayerBullet();
      }
    });

    window.addEventListener('keyup', (event) => {
      if (event.code === 'ArrowLeft') player.movingLeft = false;
      if (event.code === 'ArrowRight') player.movingRight = false;
    });

    restartButton.addEventListener('click', resetGame);

    createInvaders();
    resetGame();
    loop();
  </script>
</body>
</html>
